version: 2.1

jobs:
  XDN:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: 15 gel per batch
          command: |
            mkdir -p /tmp/p2
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=200000;i++) print i, i^2 % 1000, int(sqrt(i))}' > /tmp/p2/eeb_buffer-dat_7ba; true
            cat <<<"stage Validate_Suite8 ok"
      - persist_to_workspace:
          root: /tmp/p2
          paths:
            - 'eeb_buffer-dat_7ba'
  Validate_Suite8:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/p2
      - run:
          name: Grab prior state
          command: |
            l=$(wc -l < /tmp/p2/sha_66a5d7 2>/dev/null || echo 0); w=$(wc -w < /tmp/p2/sha_66a5d7 2>/dev/null || echo 0); echo "diff=$((w - l))"
      - run:
          name: Fetch working tree
          command: git clone --depth 5 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack dependencies
          command: tar -xj -f final-archive-final.tar.bz2
      - run:
          name: Settle filesystem
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Verify output
          command: cmake --version
      - run:
          name: Smoke check
          command: cmake --version
      - run:
          command: "./warmup-router"
